<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="celestialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6d8"/>
      <stop offset="50%" stop-color="#f5d061"/>
      <stop offset="100%" stop-color="#b38728"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#celestialGrad)" stroke="#f5d061" stroke-width="2"/>
  <!-- Eight-pointed star & Eye of Providence / Arcana Sun -->
  <polygon points="50,15 58,38 82,38 63,53 70,76 50,62 30,76 37,53 18,38 42,38" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="50" cy="50" r="10" fill="#0a0c1a" stroke="#f5d061" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="#f5d061"/>
</svg>
